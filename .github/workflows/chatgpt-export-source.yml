name: ChatGPT Source Export

on:
  push:
    branches:
      - chatgpt-export-20260918

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Create source ZIP
        run: git archive --format=zip --output=voltroute-main.zip HEAD
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: voltroute-main-source
          path: voltroute-main.zip
          if-no-files-found: error
          retention-days: 1
